name: census-downloads

# Every CMake `file(DOWNLOAD ...)` in TheRock's pinned submodules, and which
# resolve under waybill spec 1535's FR-001 (#1565). Sparse, blob-less
# checkouts of `*.cmake` and `CMakeLists.txt` only, at the pins recorded in
# the captured therock_manifest.json.

on:
  workflow_dispatch:
    inputs:
      waybill_ref:
        description: "waybill ref to scan the rocSPARSE/hipSPARSE roots with (empty: census only)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fixture
      - name: Sparse checkouts at the pins
        run: |
          set -euo pipefail
          mkdir -p src
          python3 -I -B - <<'PY' > pins.tsv
          import json
          m = json.load(open("fixture/sdk/share/therock/therock_manifest.json"))
          for s in m["submodules"]:
              print(s["submodule_name"], s["submodule_url"], s["pin_sha"], sep="\t")
          PY
          while IFS=$'\t' read -r name url sha; do
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ && "$sha" =~ ^[0-9a-f]{40}$ && "$url" =~ ^https://github\.com/ ]] || { echo "bad pin $name"; exit 1; }
            git init -q "src/$name"
            git -C "src/$name" remote add origin "$url"
            git -C "src/$name" config core.sparseCheckout true
            git -C "src/$name" sparse-checkout set --no-cone '*.cmake' 'CMakeLists.txt'
            git -C "src/$name" fetch -q --depth 1 --filter=blob:none origin "$sha"
            git -C "src/$name" checkout -q FETCH_HEAD
            echo "$name $(git -C "src/$name" rev-parse HEAD) $(find "src/$name" -name '*.cmake' -o -name CMakeLists.txt | wc -l) cmake files"
          done < pins.tsv
      - name: Census
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -I -B fixture/census/downloads.py src out/downloads.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.waybill_ref != ''
        with:
          persist-credentials: false
          repository: kusari-oss/waybill
          ref: ${{ inputs.waybill_ref }}
          path: waybill
      - name: Scan rocSPARSE and hipSPARSE roots (waybill spec 1535 SC-001)
        if: inputs.waybill_ref != ''
        run: |
          set -euo pipefail
          (cd waybill && cargo build --release -p waybill)
          echo "waybill $(git -C waybill rev-parse HEAD)"
          for p in rocsparse hipsparse; do
            HOME="$RUNNER_TEMP/home-$p" waybill/target/release/waybill --offline sbom scan \
              --path "src/rocm-libraries/projects/$p" --no-deep-hash \
              --format cyclonedx-json,spdx-3-json \
              --output "cyclonedx-json=out/$p.cdx.json" --output "spdx-3-json=out/$p.spdx3.json"
          done
          python3 -I -B - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          stems = sorted({os.path.splitext(l.split(" ", 2)[2].split(" -> ")[0])[0].rsplit("/", 1)[1]
                          for l in open("fixture/listing/all-files.txt")
                          if l.startswith("- ") and "/clients/matrices/" in l})
          print(f"## SC-001\n\ninstalled matrix stems: {len(stems)}\n")
          for p in ["rocsparse", "hipsparse"]:
              d = json.load(open(f"out/{p}.cdx.json"))
              meta = {x["name"]: x["value"] for x in d["metadata"].get("properties", [])}
              ds = [c for c in d.get("components", []) if c.get("type") == "data"]
              names = sorted(c["name"] for c in ds)
              print(f"### {p}\n\n- C229: `{meta.get('waybill:declared-downloads', 'absent')}`")
              print(f"- data components: {len(ds)}; all with checksum: {all('checksum=' in c['purl'] for c in ds)}")
              print(f"- matching installed stems: {len(set(names) & set(stems))}; not installed: {sorted(set(names) - set(stems))}")
              for c in ds[:3]:
                  print(f"  - `{c['purl']}`")
              g = json.load(open(f"out/{p}.spdx3.json"))["@graph"]
              print(f"- SPDX 3 dataset_DatasetPackage elements: {sum(1 for e in g if e.get('type') == 'dataset_DatasetPackage')}\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: census-downloads
          path: out/
