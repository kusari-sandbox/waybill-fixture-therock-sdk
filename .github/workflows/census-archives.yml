name: census-archives

# Census of the static archives (.a) in the pinned SDK tarball, for waybill
# spec 1612 (#1534): formats, member counts and sizes, and the source paths
# their members carry, compared with every non-archive ELF file in the tree.
# See census/archives.py. Downloads the same pinned tarball as `capture`.

on:
  workflow_dispatch:
    inputs:
      tarball:
        type: string
        default: therock-dist-linux-gfx1150-7.14.0a20260612.tar.gz
      version_id:
        type: string
        default: nC_zQeaccuo2uqpYvvLJV2rismYLhW5t
      expected_size:
        type: string
        default: "3317540625"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate inputs
        env:
          TARBALL: ${{ inputs.tarball }}
          VERSION_ID: ${{ inputs.version_id }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^therock-dist-linux-[A-Za-z0-9._-]+\.tar\.gz$ ]] || { echo "bad tarball name"; exit 1; }
          [[ "$VERSION_ID" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad version id"; exit 1; }
          [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]] || { echo "bad size"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fixture

      - name: Choose a work directory
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          avail_mnt=$(df --output=avail -B1G /mnt 2>/dev/null | tail -n 1 | tr -d ' ' || echo 0)
          if [ "${avail_mnt:-0}" -ge 25 ]; then
            sudo mkdir -p /mnt/work && sudo chown "$(id -u):$(id -g)" /mnt/work
            echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/work"; echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          fi

      - name: Download and extract
        env:
          TARBALL: ${{ inputs.tarball }}
          VERSION_ID: ${{ inputs.version_id }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/sdk"
          curl -fsSL --retry 3 --retry-delay 10 -o "$WORK/sdk.tar.gz" "https://rocm.nightlies.amd.com/tarball/${TARBALL}?versionId=${VERSION_ID}"
          [ "$(stat -c %s "$WORK/sdk.tar.gz")" = "$EXPECTED_SIZE" ] || { echo "size mismatch"; exit 1; }
          sha256sum "$WORK/sdk.tar.gz"
          tar -xzf "$WORK/sdk.tar.gz" -C "$WORK/sdk"
          rm -f "$WORK/sdk.tar.gz"
          du -sh "$WORK/sdk"

      - name: Census
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -I -B fixture/census/archives.py "$WORK/sdk" fixture/sdk/share/therock/therock_manifest.json out/archives.json \
            | tee out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: census-archives
          path: out/
