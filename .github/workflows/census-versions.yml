name: census-versions

# Census of waybill's curated embedded-version matches by the byte before
# each literal (waybill #1568, #1641, spec 1643 T005). See census/versions.py.
# waybill_ref must be a log-only build: it emits `waybill::version_census`
# debug events and its output is unchanged. The SDK job scans the full pinned
# tarball (the same one `measure-full` downloads); the corpus jobs scan the
# 18 quality-corpus targets at their pins, as census-owners does.
#
# Spec 1644 (waybill #1641): the same events now include `anchored=` and
# `unanchored=` lines for bzip2, GMP and liblzma. The `control` job scans a
# synthetic tree (census/anchored_control.py) and fails unless it sees the
# three expected `versioned` events and nothing else, so a zero in the other
# jobs means absence, not a broken probe. The SDK job also saves the
# strings of every liblzma-anchored binary, to look for a text anchor
# (spec 1644 FR-003).

on:
  workflow_dispatch:
    inputs:
      waybill_ref:
        description: "waybill commit (full SHA), a log-only build"
        type: string
        required: true
      tarball:
        type: string
        default: therock-dist-linux-gfx1150-7.14.0a20260612.tar.gz
      version_id:
        type: string
        default: nC_zQeaccuo2uqpYvvLJV2rismYLhW5t
      expected_size:
        type: string
        default: "3317540625"

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check inputs
        env:
          WAYBILL_REF: ${{ inputs.waybill_ref }}
        run: |
          set -euo pipefail
          [[ "$WAYBILL_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "waybill_ref must be a full SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fixture

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: kusari-oss/waybill
          ref: ${{ inputs.waybill_ref }}
          path: waybill

      - name: Build waybill
        run: |
          set -euo pipefail
          (cd waybill && cargo build --release -p waybill)

      - name: Scan the synthetic control tree
        run: |
          set -euo pipefail
          mkdir -p out
          echo "waybill $(git -C waybill rev-parse HEAD)" > out/refs.txt
          python3 -I -B fixture/census/anchored_control.py control-tree
          RUST_LOG=waybill::version_census=debug HOME="$RUNNER_TEMP/home" waybill/target/release/waybill --offline sbom scan \
            --path control-tree --no-deep-hash --format cyclonedx-json --output out/scan-control.cdx.json 2> out/scan-control.log
          python3 -I -B fixture/census/versions.py control out/scan-control.log out/versions-control.json out/scan-control.cdx.json \
            | tee out/summary-control.md >> "$GITHUB_STEP_SUMMARY"
          python3 -I -B - out/versions-control.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          got = sorted((a["library"], a["verdict"], a.get("version")) for a in r["anchored"])
          want = [("bzip2", "versioned", "1.0.8"), ("gmp", "versioned", "6.3.0"), ("liblzma", "versioned", "5.8.1")]
          if got != want or r["unanchored"]:
              sys.exit(f"control failed: {got} unanchored={r['unanchored']}")
          print("control ok:", got)
          PY

      # Spec 1645 (waybill #1662): the identity control. The census must
      # report exactly the log-only or the wired set of events, so a zero in
      # the corpus jobs means absence, not a broken probe.
      - name: Scan the spec 1645 identity control tree
        run: |
          set -euo pipefail
          python3 -I -B fixture/census/anchored_control.py control-tree-unused identity-tree
          RUST_LOG=waybill::version_census=debug HOME="$RUNNER_TEMP/home" waybill/target/release/waybill --offline sbom scan \
            --path identity-tree --no-deep-hash --format cyclonedx-json --output out/scan-identity.cdx.json 2> out/scan-identity.log
          python3 -I -B fixture/census/versions.py identity out/scan-identity.log out/versions-identity.json out/scan-identity.cdx.json \
            | tee out/summary-identity.md >> "$GITHUB_STEP_SUMMARY"
          python3 -I -B - out/versions-identity.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          shared = sorted((s["curated"]["library"], s["verdict"]) for s in r["shared_file"])
          changes = sorted((c["library"], c["old"], c["new"]) for c in r["curated_version_change"])
          cpes = sorted(c["purl"] for c in r["cpe_form_change"])
          # The log-only commit (7db3e627) reports all three kinds. Once
          # wired, LLVM's PURLs are equal (no shared file to decide) and the
          # two census-only kinds are gone; ncurses is still `merge`.
          log_only = (
              [("llvm", "version-disagrees"), ("ncurses", "merge")],
              [("llvm", "23.0.0", "23.0.0git"), ("ncurses", "6.6", "6.6.20251230")],
              ["pkg:generic/ncurses@6.4.20221231"],
          )
          wired = ([("ncurses", "merge")], [], [])
          if (shared, changes, cpes) not in (log_only, wired):
              sys.exit(f"identity control failed: {shared} {changes} {cpes}")
          print("identity control ok:", shared, changes, cpes)
          PY
          # Spec 1646 (waybill #1665): both states report the two merges with
          # a record. Log-only also reports three technique changes; wired,
          # that event is gone and the document carries binary-analysis.
          python3 -I -B - out/versions-identity.json out/scan-identity.cdx.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1])); doc = json.load(open(sys.argv[2]))
          stack, comps = list(doc.get("components", [])), {}
          while stack:
              c = stack.pop(); stack.extend(c.get("components", []))
              if c.get("purl"):
                  comps[c["purl"].split("?")[0]] = [m["technique"] for i in c.get("evidence", {}).get("identity", []) for m in i.get("methods", [])]
          merged = sorted({m["purl"] for m in r["binary_merge"] if m["winner"]["mechanism"] or m["loser"]["mechanism"]})
          changed = sorted({c["purl"] for c in r["technique_change"]})
          zlib = [p for p in comps if p.startswith("pkg:generic/zlib")]
          log_only = (merged == ["pkg:generic/llvm@23.0.0git", "pkg:generic/ncurses@6.6.20251230"]
                      and changed == sorted(["pkg:generic/llvm@23.0.0git", "pkg:generic/ncurses@6.6.20251230"] + zlib))
          wired = (merged == ["pkg:generic/llvm@23.0.0git", "pkg:generic/ncurses@6.6.20251230"] and not r["technique_change"]
                   and comps.get("pkg:generic/ncurses@6.6.20251230") == ["manifest-analysis", "binary-analysis"]
                   and comps.get("pkg:generic/llvm@23.0.0git") == ["manifest-analysis", "binary-analysis"]
                   and len(zlib) == 1 and comps[zlib[0]] == ["binary-analysis"])
          if not (log_only or wired):
              sys.exit(f"spec 1646 control failed: merged={merged} changed={changed} zlib={zlib} "
                       f"methods={ {p: comps.get(p) for p in ['pkg:generic/ncurses@6.6.20251230', 'pkg:generic/llvm@23.0.0git'] + zlib} }")
          print("spec 1646 control ok:", "log-only" if log_only else "wired", merged, changed)
          PY

      # Spec 1647 (waybill #1664): a real static liblzma, built on the runner
      # from census/static_lzma/a.c, unstripped and stripped. Log-only: the
      # census shows rule A versioning the unstripped one and rule B the
      # stripped one, and the document has no liblzma. Wired: the unstripped
      # one is in the document, and the stripped one has no event (rule B
      # removed) or still rule B (if it were adopted).
      - name: Scan the spec 1647 static liblzma control
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends liblzma-dev
          dpkg-query -W -f 'liblzma-dev ${Version}\n' liblzma-dev | tee -a out/refs.txt
          mkdir -p static-tree
          gcc -O2 -o static-tree/waybill-fixture-xzstatic fixture/census/static_lzma/a.c -static -llzma
          cp static-tree/waybill-fixture-xzstatic static-tree/waybill-fixture-xzstripped
          strip static-tree/waybill-fixture-xzstripped
          gcc -O2 -o "$RUNNER_TEMP/lzma-version" fixture/census/static_lzma/b.c -llzma
          ver=$("$RUNNER_TEMP/lzma-version" | awk '{print $3}')
          echo "runner liblzma version: $ver"
          RUST_LOG=waybill::version_census=debug HOME="$RUNNER_TEMP/home" waybill/target/release/waybill --offline sbom scan \
            --path static-tree --no-deep-hash --format cyclonedx-json --output out/scan-static.cdx.json 2> out/scan-static.log
          python3 -I -B fixture/census/versions.py static out/scan-static.log out/versions-static.json out/scan-static.cdx.json \
            | tee out/summary-static.md >> "$GITHUB_STEP_SUMMARY"
          python3 -I -B - out/versions-static.json out/scan-static.cdx.json "$ver" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1])); doc = json.load(open(sys.argv[2])); ver = sys.argv[3]
          stack, purls = list(doc.get("components", [])), set()
          while stack:
              c = stack.pop(); stack.extend(c.get("components", []))
              purls.add((c.get("purl") or "").split("?")[0])
          lz = sorted(p for p in purls if p.startswith("pkg:generic/liblzma@"))
          ev = {e["path"].rsplit("/", 1)[-1]: e for e in r["liblzma_static"]}
          def verdict(e, rule):
              v = [x for x in (e or {}).get(rule, []) if x["library"] == "liblzma"]
              return (v[0]["verdict"], v[0].get("version")) if v else None
          un, st = ev.get("waybill-fixture-xzstatic"), ev.get("waybill-fixture-xzstripped")
          want = ("versioned", ver)
          log_only = (verdict(un, "rule_a") == want and verdict(st, "rule_b") == want and lz == [])
          wired = (verdict(un, "rule_a") == want and lz == [f"pkg:generic/liblzma@{ver}"]
                   and (st is None or verdict(st, "rule_b") == want))
          if not (log_only or wired):
              sys.exit(f"spec 1647 control failed: ver={ver} unstripped={un} stripped={st} liblzma={lz}")
          print("spec 1647 control ok:", "log-only" if log_only else "wired", ver, lz,
                "stripped event" if st else "no stripped event")
          PY

      # Spec 1648 (waybill #1668): real builds on the runner. A dynamically
      # linked C program gives dynamic-linkage components (glibc's versioned
      # imports); a Go program gives BuildInfo components. Log-only: the
      # C program's dynamic-linkage components have kind_technique_change and
      # the Go binary's have go-buildinfo. Wired: dynamic-linkage reports
      # binary-analysis in the document, and go-buildinfo is still counted.
      - name: Scan the spec 1648 binary-kind control
        run: |
          set -euo pipefail
          mkdir -p kind-tree "$RUNNER_TEMP/gosrc"
          printf '#include <stdio.h>\nint main(void){puts("waybill-fixture");return 0;}\n' > "$RUNNER_TEMP/dyn.c"
          gcc -O2 -o kind-tree/waybill-fixture-dyn "$RUNNER_TEMP/dyn.c"
          printf 'package main\nimport "fmt"\nfunc main(){fmt.Println("waybill-fixture")}\n' > "$RUNNER_TEMP/gosrc/main.go"
          (cd "$RUNNER_TEMP/gosrc" && go mod init example.com/waybill-fixture-go >/dev/null 2>&1 && go build -o "$GITHUB_WORKSPACE/kind-tree/waybill-fixture-gobin" .)
          go version | tee -a out/refs.txt
          RUST_LOG=waybill::version_census=debug HOME="$RUNNER_TEMP/home" waybill/target/release/waybill --offline sbom scan \
            --path kind-tree --no-deep-hash --format cyclonedx-json --output out/scan-kind.cdx.json 2> out/scan-kind.log
          python3 -I -B fixture/census/versions.py kind out/scan-kind.log out/versions-kind.json out/scan-kind.cdx.json \
            | tee out/summary-kind.md >> "$GITHUB_STEP_SUMMARY"
          python3 -I -B - out/versions-kind.json out/scan-kind.cdx.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1])); doc = json.load(open(sys.argv[2]))
          stack, dl = list(doc.get("components", [])), {}
          while stack:
              c = stack.pop(); stack.extend(c.get("components", []))
              props = {p.get("name"): p.get("value") for p in c.get("properties", [])}
              if props.get("waybill:evidence-kind") == "dynamic-linkage":
                  dl[c["purl"].split("?")[0]] = [m["technique"] for i in c.get("evidence", {}).get("identity", []) for m in i.get("methods", [])]
          changed = sorted({c["purl"] for c in r["kind_technique_change"] if c["evidence_kind"] == "dynamic-linkage"})
          gb = sorted({c["purl"] for c in r["binary_derived_kind"] if c["evidence_kind"] == "go-buildinfo"})
          log_only = bool(dl) and changed == sorted(dl) and all(v == ["manifest-analysis"] for v in dl.values())
          wired = bool(dl) and not r["kind_technique_change"] and all(v == ["binary-analysis"] for v in dl.values())
          if not ((log_only or wired) and gb):
              sys.exit(f"spec 1648 control failed: dynamic-linkage={dl} changed={changed} go-buildinfo={gb}")
          print("spec 1648 control ok:", "log-only" if log_only else "wired", sorted(dl), len(gb), "go-buildinfo")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: census-versions-control
          path: out/

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check inputs
        env:
          WAYBILL_REF: ${{ inputs.waybill_ref }}
          TARBALL: ${{ inputs.tarball }}
          VERSION_ID: ${{ inputs.version_id }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          [[ "$WAYBILL_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "waybill_ref must be a full SHA"; exit 1; }
          [[ "$TARBALL" =~ ^therock-dist-linux-[A-Za-z0-9._-]+\.tar\.gz$ ]] || { echo "bad tarball name"; exit 1; }
          [[ "$VERSION_ID" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad version id"; exit 1; }
          [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]] || { echo "bad size"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fixture

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: kusari-oss/waybill
          ref: ${{ inputs.waybill_ref }}
          path: waybill

      - name: Build waybill
        run: |
          set -euo pipefail
          (cd waybill && cargo build --release -p waybill)
          echo "waybill $(git -C waybill rev-parse HEAD)"

      - name: Choose a work directory
        run: |
          set -euo pipefail
          avail_mnt=$(df --output=avail -B1G /mnt 2>/dev/null | tail -n 1 | tr -d ' ' || echo 0)
          avail_root=$(df --output=avail -B1G / | tail -n 1 | tr -d ' ')
          echo "free GB: /mnt=$avail_mnt /=$avail_root"
          if [ "${avail_mnt:-0}" -ge 25 ]; then
            sudo mkdir -p /mnt/work && sudo chown "$(id -u):$(id -g)" /mnt/work
            echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          else
            echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          fi

      - name: Download and extract
        env:
          TARBALL: ${{ inputs.tarball }}
          VERSION_ID: ${{ inputs.version_id }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/sdk"
          url="https://rocm.nightlies.amd.com/tarball/${TARBALL}?versionId=${VERSION_ID}"
          curl -fsSL --retry 3 --retry-delay 10 -o "$WORK/sdk.tar.gz" "$url"
          size=$(stat -c %s "$WORK/sdk.tar.gz")
          [ "$size" = "$EXPECTED_SIZE" ] || { echo "size $size != expected $EXPECTED_SIZE"; exit 1; }
          sha256sum "$WORK/sdk.tar.gz" | tee sdk.sha256
          tar -xzf "$WORK/sdk.tar.gz" -C "$WORK/sdk"
          rm -f "$WORK/sdk.tar.gz"
          du -sh "$WORK/sdk"

      - name: Scan and census
        run: |
          set -euo pipefail
          mkdir -p out
          echo "sdk $(cut -d' ' -f1 sdk.sha256)" > out/refs.txt
          echo "waybill $(git -C waybill rev-parse HEAD)" >> out/refs.txt
          RUST_LOG=waybill::version_census=debug HOME="$RUNNER_TEMP/home" waybill/target/release/waybill --offline sbom scan \
            --path "$WORK/sdk" --no-deep-hash --format cyclonedx-json,spdx-2.3-json,spdx-3-json \
            --output "cyclonedx-json=out/scan-sdk.cdx.json" --output "spdx-2.3-json=out/scan-sdk.spdx23.json" \
            --output "spdx-3-json=out/scan-sdk.spdx3.json" 2> out/scan-sdk.log
          python3 -I -B fixture/census/versions.py therock-sdk out/scan-sdk.log out/versions-therock-sdk.json \
            out/scan-sdk.cdx.json | tee out/summary-therock-sdk.md >> "$GITHUB_STEP_SUMMARY"

      - name: Strings of liblzma-anchored binaries (spec 1644 FR-003)
        run: |
          set -euo pipefail
          mkdir -p out/lzma-strings
          python3 -I -B -c 'import json,sys; [print(a["path"]) for a in json.load(open(sys.argv[1]))["anchored"] if a["library"]=="liblzma"]' \
            out/versions-therock-sdk.json | sort -u > out/lzma-paths.txt
          wc -l < out/lzma-paths.txt
          n=0
          while IFS= read -r p; do
            n=$((n+1))
            strings -a -n 4 "$p" > "out/lzma-strings/$n.txt"
            echo "$n $p" >> out/lzma-strings/index.txt
          done < out/lzma-paths.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: census-versions-therock-sdk
          path: out/

  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: go-cobra
            url: https://github.com/spf13/cobra
            ref: a655097faf7d54f78933a815984b9919d51a05d2
          - target: go-kubernetes
            url: https://github.com/kubernetes/kubernetes
            ref: 157e582fcc3ebba3c22b16721f49d6890f784c1f
          - target: rust-ripgrep
            url: https://github.com/BurntSushi/ripgrep
            ref: 0e8390a66fbcf6eeac1aeb0541b367663a597c79
          - target: rust-zizmor
            url: https://github.com/zizmorcore/zizmor
            ref: fb814d6687450fc8e0b0fba8d958b1ac40c0647f
          - target: npm-express
            url: https://github.com/expressjs/express
            ref: e99649895f714c9dc9b3538e2cb0f58954f0ecfa
          - target: pnpm-vue-core
            url: https://github.com/vuejs/core
            ref: d63616ca17de965ed32dcb449a4c5cd9982f15d2
          - target: yarn-guac-visualizer
            url: https://github.com/guacsec/guac-visualizer
            ref: cd322cd47518f37ff6ec8a24377143eeb911e2e7
          - target: python-flask
            url: https://github.com/pallets/flask
            ref: 80be49be88b534d2a72ef6bf5ea4aabf89f3305b
          - target: python-ansible
            url: https://github.com/ansible/ansible
            ref: 6e7ec0333c89b258753534ec68caff167345079c
          - target: python-pytorch
            url: https://github.com/pytorch/pytorch
            ref: 2b3ec34829036a65cd9d1398ea72a0167dc37470
          - target: uv-meilisearch-python
            url: https://github.com/meilisearch/meilisearch-python
            ref: 8147a9dcff97da126663360588229079ab8400c8
          - target: pants-backend-ai
            url: https://github.com/lablup/backend.ai
            ref: 809fcd394dd8e39456986dd742e7d51c6aedd647
          - target: maven-guice
            url: https://github.com/google/guice
            ref: b0e1d0fab0167cd555ab8d262333c1a32db7d492
          - target: gradle-apache-solr
            url: https://github.com/apache/solr
            ref: 28c1bc1f9394be8d6187a3550db964c49a9a8b0a
          - target: gradle-bitwarden-android
            url: https://github.com/bitwarden/android
            ref: d817f6b4bf7c17172a74fabca1e09e738c7ec6c9
          - target: ruby-rails
            url: https://github.com/rails/rails
            ref: 90588c21894456d979d7195502e6f5918f8d59ea
          - target: cmake-nlohmann-json
            url: https://github.com/nlohmann/json
            ref: 65ee68451d8eb2b5f3a30b410476ab83deb3289b
          - target: cpp-mongo
            url: https://github.com/mongodb/mongo
            ref: 41a5752480dd86b432e7d31e8150847002e16924
    steps:
      - name: Free disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Check inputs
        env:
          WAYBILL_REF: ${{ inputs.waybill_ref }}
        run: |
          set -euo pipefail
          [[ "$WAYBILL_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "waybill_ref must be a full SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fixture

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: kusari-oss/waybill
          ref: ${{ inputs.waybill_ref }}
          path: waybill

      - name: Clone target
        env:
          URL: ${{ matrix.url }}
          REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          git init -q tree
          git -C tree remote add origin "$URL"
          git -C tree fetch -q --depth 1 origin "$REF"
          git -C tree checkout -q FETCH_HEAD
          echo "tree $(git -C tree rev-parse HEAD)"

      - name: Build waybill
        run: |
          set -euo pipefail
          (cd waybill && cargo build --release -p waybill)
          echo "waybill $(git -C waybill rev-parse HEAD)"

      - name: Scan and census
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv tree "$TARGET"
          echo "tree $(git -C "$TARGET" rev-parse HEAD)" > out/refs.txt
          echo "waybill $(git -C waybill rev-parse HEAD)" >> out/refs.txt
          RUST_LOG=waybill::version_census=debug HOME="$RUNNER_TEMP/home" waybill/target/release/waybill --offline sbom scan --path "$TARGET" \
            --no-deep-hash --format cyclonedx-json --output "out/scan-$TARGET.cdx.json" 2> "out/scan-$TARGET.log"
          python3 -I -B fixture/census/versions.py "$TARGET" "out/scan-$TARGET.log" "out/versions-$TARGET.json" \
            "out/scan-$TARGET.cdx.json" | tee "out/summary-$TARGET.md" >> "$GITHUB_STEP_SUMMARY"

